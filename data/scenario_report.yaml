list_success:
  - case_id: list_scenario_reports_success
    expected:
      status_code: 200
      body_type: dict
      required_fields:
        - items
        - total
        - page
        - page_size
        - total_pages
        - passed_count
        - failed_count
        - pass_rate

detail_success:
  - case_id: get_scenario_report_success
    expected:
      status_code: 200
      body_type: dict
      required_fields:
        - id
        - scenario_id
        - scenario_name
        - passed
        - total_steps
        - passed_steps
        - failed_steps
        - duration_ms
        - created_at
        - steps

detail_fail:
  - case_id: scenario_report_not_exist
    request:
      report_id: 999999
    expected:
      status_code: 404
      detail: 场景报告 id=999999 不存在
