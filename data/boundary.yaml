# 边界值 / 畸形输入特征化。
# 被测系统对多数字段不做校验,探测现状:
#   空 name           → 422
#   超长 name(>100)   → 422
#   非法 cron         → 422
#   perf users<=0     → 422
# body 里的 "{{LONG}}" 会被测试替换成 300 个 'a'(超过常见 varchar(255))。
cases:
  # ---- 空 name:统一由 NamedSchema 拒绝 ----
  - case_id: interface_empty_name
    path: /interfaces
    body: {name: "", method: GET, url: /health}
    expected: {status_code: 422}
    note: "名称不能为空"

  - case_id: environment_empty_name
    path: /environments
    body: {name: "", base_url: "http://localhost:8000"}
    expected: {status_code: 422}
    note: "名称不能为空"

  - case_id: schedule_empty_name
    path: /schedules
    body: {name: "", cron: "* * * * *"}
    expected: {status_code: 422}
    note: "名称不能为空"

  - case_id: mock_empty_name
    path: /mocks
    body: {name: "", path: "/auto_bnd_empty", method: GET, status: 200}
    expected: {status_code: 422}
    note: "名称不能为空"

  - case_id: scenario_empty_name
    path: /scenarios
    body: {name: "", description: "d", case_ids: []}
    expected: {status_code: 422}
    note: "名称不能为空"

  - case_id: project_empty_name
    path: /projects
    body: {name: "", description: "d"}
    expected: {status_code: 422}
    note: "名称不能为空"

  # ---- 超长 name:统一由 NamedSchema 拒绝 ----
  - case_id: interface_overlong_name
    path: /interfaces
    body: {name: "{{LONG}}", method: GET, url: /health}
    expected: {status_code: 422}
    note: "名称长度不能超过 100 个字符"

  - case_id: environment_overlong_name
    path: /environments
    body: {name: "{{LONG}}", base_url: "http://localhost:8000"}
    expected: {status_code: 422}
    note: "名称长度不能超过 100 个字符"

  - case_id: schedule_overlong_name
    path: /schedules
    body: {name: "{{LONG}}", cron: "* * * * *"}
    expected: {status_code: 422}
    note: "名称长度不能超过 100 个字符"

  - case_id: mock_overlong_name
    path: /mocks
    body: {name: "{{LONG}}", path: "/auto_bnd_long", method: GET, status: 200}
    expected: {status_code: 422}
    note: "名称长度不能超过 100 个字符"

  - case_id: scenario_overlong_name
    path: /scenarios
    body: {name: "{{LONG}}", description: "d", case_ids: []}
    expected: {status_code: 422}
    note: "名称长度不能超过 100 个字符"

  # ---- 其它畸形值 ----
  - case_id: schedule_invalid_cron
    path: /schedules
    body: {name: "auto_bnd_cron", cron: "not-a-cron"}
    expected: {status_code: 422}
    note: "Cron 表达式不合法"

  - case_id: perf_users_zero
    path: /perf/tasks
    body: {name: "auto_bnd_u0", target_host: "http://localhost:8000", target_path: /health, users: 0, spawn_rate: 1, duration: 1}
    expected: {status_code: 422}
    note: "users 必须大于等于 1"

  - case_id: perf_users_negative
    path: /perf/tasks
    body: {name: "auto_bnd_uneg", target_host: "http://localhost:8000", target_path: /health, users: -5, spawn_rate: 1, duration: 1}
    expected: {status_code: 422}
    note: "users 必须大于等于 1"
