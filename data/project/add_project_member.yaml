add_project_member_success:
  - case_id: owner_add_project_member
    actor: owner
    request:
      role: member
    expected:
      status_code: 201
      required_fields:
        - id
        - project_id
        - user_id
        - role
        - created_at
        - user

  - case_id: admin_add_project_member
    actor: admin
    request:
      role: member
    expected:
      status_code: 201
      required_fields:
        - id
        - project_id
        - user_id
        - role
        - created_at
        - user

add_project_member_fail:
  - case_id: member_add_project_member
    actor: member
    request:
      role: member
    expected:
      status_code: 403
      detail: 无权执行 project_member.manage 操作

  - case_id: duplicate_project_member
    actor: owner
    request:
      role: member
    expected:
      status_code: 409
      detail: 用户已经是团队成员

  - case_id: add_nonexistent_user
    actor: owner
    request:
      user_id: 999999
      role: member
    expected:
      status_code: 404
      detail: 用户不存在

  - case_id: add_project_owner_role
    actor: owner
    request:
      role: owner
    expected:
      status_code: 422

  - case_id: add_project_member_without_token
    actor: anonymous
    request:
      role: member
    expected:
      status_code: 401
      detail: Not authenticated
