create_success:
  - case_id: create_schedule_success
    request:
      name_prefix: auto_sch_create_
      cron: "* * * * *"
    expected:
      status_code: 201
      code: 0
      required_fields:
        - id
        - name
        - cron

list_success:
  - case_id: list_schedule_success
    expected:
      status_code: 200
      code: 0
      body_type: list

detail_success:
  - case_id: get_schedule_success
    expected:
      status_code: 200
      code: 0
      required_fields:
        - id
        - name
        - cron

detail_fail:
  - case_id: schedule_not_exist
    request:
      schedule_id: 999999
    expected:
      status_code: 404
      code: 404

update_success:
  - case_id: update_schedule_success
    request:
      name_prefix: auto_sch_upd_
      cron: "*/5 * * * *"
    expected:
      status_code: 200
      code: 0

delete_success:
  - case_id: delete_schedule_success
    expected:
      status_code: 200
      code: 0

# 鉴权：schedule 创建必须携带 token
create_no_token:
  - case_id: create_schedule_without_token
    request:
      name_prefix: auto_sch_notoken_
      cron: "* * * * *"
    expected:
      status_code: 401
      code: 401
      detail: Not authenticated
