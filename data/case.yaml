create_success:
  - case_id: create_case_success
    request:
      name_prefix: auto_case_create_
      expected_status: 200
    expected:
      status_code: 201
      required_fields:
        - id
        - name
        - interface_id
        - expected_status

list_success:
  - case_id: list_case_success
    expected:
      status_code: 200
      body_type: list

detail_success:
  - case_id: get_case_success
    expected:
      status_code: 200
      required_fields:
        - id
        - name
        - interface_id

detail_fail:
  - case_id: case_not_exist
    request:
      case_id: 999999
    expected:
      status_code: 404

update_success:
  - case_id: update_case_success
    request:
      name_prefix: auto_case_updated_
      expected_status: 201
      retries: 2
      tags:
        - smoke
        - updated
      extract_rules:
        token: data.token
      assertions:
        - type: status
          expected: 201
    expected:
      status_code: 200
      required_fields:
        - id
        - name
        - interface_id
        - expected_status

update_fail:
  - case_id: update_case_not_exist
    request:
      case_id: 999999
      expected_status: 200
    expected:
      status_code: 404

  - case_id: update_case_interface_not_exist
    request:
      interface_id: 999999
      expected_status: 200
    expected:
      status_code: 400

  - case_id: update_case_wrong_type
    request:
      interface_id: not-an-int
      expected_status: 200
    expected:
      status_code: 422

  - case_id: update_case_without_token
    request:
      expected_status: 200
    expected:
      status_code: 401
      detail: Not authenticated

delete_success:
  - case_id: delete_case_success
    expected:
      status_code: 200

run_success:
  - case_id: run_case_success
    expected:
      status_code: 200
      required_fields:
        - passed
        - expected_status
        - actual_status
        - attempts

chain_success:
  - case_id: run_case_chain_success
    expected:
      status_code: 200
      body_type: list

create_fail:
  - case_id: create_case_wrong_type
    request:
      name_prefix: auto_case_badtype_
      interface_id: not-an-int
      expected_status: 200
    expected:
      status_code: 422

# 鉴权：case 创建必须携带 token
create_no_token:
  - case_id: create_case_without_token
    request:
      name_prefix: auto_case_notoken_
      expected_status: 200
    expected:
      status_code: 401
      detail: Not authenticated
