logout_success:
  - case_id: logout_success
    request: {}
    expected:
      status_code: 200
      code: 0
      message: 登出成功

logout_fail:
  - case_id: missing_token
    request:
      headers: {}
    expected:
      status_code: 401
      code: 401
      message: Not authenticated

  - case_id: invalid_token
    request:
      headers:
        Authorization: Bearer invalid-token
    expected:
      status_code: 401
      code: 401
      message: 无效或过期的凭证
