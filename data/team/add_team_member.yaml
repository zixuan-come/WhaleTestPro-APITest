add_team_member_success:
  - case_id: owner_add_team_member
    actor: owner
    request:
      role: member
    expected:
      status_code: 201
      required_fields:
        - id
        - team_id
        - user_id
        - role
        - created_at
        - user

  - case_id: admin_add_team_member
    actor: admin
    request:
      role: member
    expected:
      status_code: 201
      required_fields:
        - id
        - team_id
        - user_id
        - role
        - created_at
        - user

add_team_member_fail:
  - case_id: member_add_team_member
    actor: member
    request:
      role: member
    expected:
      status_code: 403
      detail: 只有团队所有者或管理员可以执行此操作

  - case_id: duplicate_team_member
    actor: owner
    request:
      role: member
    expected:
      status_code: 409
      detail: 用户已经是团队成员

  - case_id: add_nonexistent_user
    actor: owner
    request:
      user_id: 999999
      role: member
    expected:
      status_code: 404
      detail: 用户不存在

  - case_id: add_team_owner_role
    actor: owner
    request:
      role: owner
    expected:
      status_code: 422

  - case_id: add_team_member_without_token
    actor: anonymous
    request:
      role: member
    expected:
      status_code: 401
      detail: Not authenticated
