remove_team_member_success:
  - case_id: owner_remove_team_member
    actor: owner
    expected:
      status_code: 200

  - case_id: admin_remove_team_member
    actor: admin
    expected:
      status_code: 200

remove_team_member_fail:
  - case_id: member_remove_team_member
    actor: member
    expected:
      status_code: 403
      detail: 只有团队所有者或管理员可以执行此操作

  - case_id: remove_nonexistent_team_member
    actor: owner
    request:
      member_id: 999999
    expected:
      status_code: 404
      detail: 团队成员不存在

  - case_id: cross_team_remove_member
    actor: owner
    request:
      target_team: other
    expected:
      status_code: 404
      detail: 团队成员不存在

  - case_id: remove_team_owner
    actor: owner
    expected:
      status_code: 409
      detail: 团队所有者不能被移除

  - case_id: remove_team_member_without_token
    actor: anonymous
    expected:
      status_code: 401
      detail: Not authenticated
