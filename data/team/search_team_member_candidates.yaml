search_team_member_candidates_success:
  - case_id: owner_search_team_member_candidates
    actor: owner
    expected:
      status_code: 200
      body_type: list

  - case_id: admin_search_team_member_candidates
    actor: admin
    expected:
      status_code: 200
      body_type: list

search_team_member_candidates_fail:
  - case_id: member_search_team_member_candidates
    actor: member
    expected:
      status_code: 403
      detail: 只有团队所有者或管理员可以执行此操作

  - case_id: outsider_search_team_member_candidates
    actor: outsider
    expected:
      status_code: 404
      detail: 团队不存在或无权访问

  - case_id: short_search_keyword
    actor: owner
    request:
      keyword: a
    expected:
      status_code: 422

  - case_id: search_team_member_candidates_without_token
    actor: anonymous
    expected:
      status_code: 401
      detail: Not authenticated
