update_team_member_role_success:
  - case_id: owner_update_team_member_role
    actor: owner
    request:
      role: admin
    expected:
      status_code: 200
      required_fields:
        - id
        - team_id
        - user_id
        - role
        - created_at
        - user

  - case_id: admin_update_team_member_role
    actor: admin
    request:
      role: admin
    expected:
      status_code: 200
      required_fields:
        - id
        - team_id
        - user_id
        - role
        - created_at
        - user

update_team_member_role_fail:
  - case_id: member_update_team_member_role
    actor: member
    request:
      role: admin
    expected:
      status_code: 403
      detail: 只有团队所有者或管理员可以执行此操作

  - case_id: update_nonexistent_team_member
    actor: owner
    request:
      member_id: 999999
      role: admin
    expected:
      status_code: 404
      detail: 团队成员不存在

  - case_id: cross_team_update_member
    actor: owner
    request:
      target_team: other
      role: admin
    expected:
      status_code: 404
      detail: 团队成员不存在

  - case_id: update_team_owner_role
    actor: owner
    request:
      role: member
    expected:
      status_code: 409
      detail: 团队所有者角色不能修改

  - case_id: update_team_member_invalid_role
    actor: owner
    request:
      role: owner
    expected:
      status_code: 422

  - case_id: update_team_member_without_token
    actor: anonymous
    request:
      role: admin
    expected:
      status_code: 401
      detail: Not authenticated
