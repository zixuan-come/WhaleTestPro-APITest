name: API Test

# 触发：推到 main / 对 main 提 PR 就跑一次黑盒回归
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # 也允许手动点按钮触发

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉本仓库(测试代码)到 ./ 下
      - name: Checkout 测试仓库
        uses: actions/checkout@v4
        with:
          path: apitest

      # 2. 拉被测系统 WhaleTestPro(独立仓库)。私有仓需在本仓 Secrets 配 BACKEND_REPO_TOKEN(有 repo 读权限的 PAT)
      - name: Checkout 被测系统 WhaleTestPro
        uses: actions/checkout@v4
        with:
          repository: zixuan-come/WhaleTestPro
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      # 3. 给被测系统写 .env(compose 读它取 SECRET_KEY / MYSQL_ROOT_PASSWORD)。CI 里用临时值即可
      - name: 准备后端 .env
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-prod
          MYSQL_ROOT_PASSWORD=ci_root_pwd
          DATABASE_URL=mysql+pymysql://root:ci_root_pwd@127.0.0.1:3306/whale_test_pro?charset=utf8mb4
          SHADOW_DATABASE_URL=mysql+pymysql://root:ci_root_pwd@127.0.0.1:3306/whale_test_pro_shadow?charset=utf8mb4
          EOF

      # 4. 先只起 MySQL,等它健康,再建影子库(compose 只自动建主库;app 启动时 create_all(engine_shadow) 连不上会崩)
      - name: 起 MySQL 并建影子库
        working-directory: backend
        run: |
          docker compose -p whaletestpro up -d mysql
          echo "等待 MySQL 健康..."
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' whaletestpro-mysql-1 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then echo "MySQL 就绪"; break; fi
            sleep 3
          done
          docker exec whaletestpro-mysql-1 mysql -uroot -pci_root_pwd \
            -e "CREATE DATABASE IF NOT EXISTS whale_test_pro_shadow;"

      # 5. 起 app + 依赖(redis/rabbitmq)。不起 worker/prometheus/grafana/frontend/locust —— 黑盒接口测试用不到
      - name: 起后端 app
        working-directory: backend
        run: docker compose -p whaletestpro up -d --build app

      # 6. 轮询 /health,等 app 真正可用(镜像构建 + create_all 需要时间)
      - name: 等待 app 就绪
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || echo 000)
            if [ "$code" = "200" ]; then echo "app 就绪"; exit 0; fi
            echo "第 $i 次探测: HTTP $code,3s 后重试"
            sleep 3
          done
          echo "app 未就绪,输出日志便于排查:"
          docker logs whaletestpro-app-1 --tail 80
          exit 1

      # 7. 装 Python + 测试依赖
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 装测试依赖
        working-directory: apitest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 8. 给测试仓写 .env(config.py require_env 要 WHALE_USERNAME/PASSWORD)
      - name: 准备测试 .env
        working-directory: apitest
        run: |
          cat > .env <<'EOF'
          WHALE_BASE_URL=http://localhost:8001
          WHALE_USERNAME=admin
          WHALE_PASSWORD=admin
          EOF

      # 9. 冒烟门禁:先只跑核心链路(-m smoke),挂了就快速失败,不必等全量
      - name: 冒烟门禁
        working-directory: apitest
        run: pytest -m smoke

      # 10. 跑全量黑盒测试,产出 allure 原始结果
      - name: 跑接口测试
        working-directory: apitest
        run: pytest --alluredir=allure-results

      # 11. 上传 allure 原始结果做产物(失败也传)
      - name: 上传 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: apitest/allure-results

      # 12. Allure CLI 需要 JRE;装 Temurin 17
      - name: 装 Java(Allure 依赖)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 13. 下载 Allure 命令行,把原始结果渲染成可看的 HTML 报告
      - name: 生成 Allure HTML 报告
        if: always()
        working-directory: apitest
        run: |
          ALLURE_VERSION=2.29.0
          curl -sL -o allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.tgz
          tar -xzf allure.tgz
          ./allure-$ALLURE_VERSION/bin/allure generate allure-results -o allure-report --clean

      # 14. 上传可直接打开的 HTML 报告
      - name: 上传 Allure HTML 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: apitest/allure-report

      # 15. 无论成败,收集后端日志便于事后排查
      - name: 收集后端日志
        if: always()
        working-directory: backend
        run: docker compose -p whaletestpro logs --tail 200 || true
